# Final team training: all rows of the validated export, never the 500-image
# smoke subset. This remains reproducible in a fresh clone because all paths
# are relative to this file and no local drive is embedded.
model: ../../yolo11n.pt
base_weights: ../../yolo11n.pt
model_variant: YOLO11n
training_stage: FINAL_FULL_DATASET
imgsz: 320
epochs: 100
patience: 20
batch: 16
seed: 230
deterministic: true
workers: 4
optimizer: auto
pretrained: true
plots: false
prediction_confidences: [0.0, 0.50]
source_dataset: ../dataset_output/dataset-v1-full
ua_annotation_roots:
  - ../storage_placeholders/online_data/raw/ua_detrac_orig/DETRAC-Train-Annotations-XML
  - ../storage_placeholders/online_data/raw/ua_detrac_orig/DETRAC-Test-Annotations-XML
model_provenance_policy: FINETUNED_TEAM_MODEL_REQUIRED
