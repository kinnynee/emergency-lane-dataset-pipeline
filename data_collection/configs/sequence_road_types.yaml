mapping_version: "1.1"
review_date: "2026-08-01"
review_scope: "CROSS_DATASET_TEST_PROPOSAL_SEQUENCE_LEVEL"
review_method: "Manual visual review plus source annotation/XML statistics"

allowed_road_types:
  - HIGHWAY
  - URBAN_ROAD
  - INTERSECTION
  - EMERGENCY_LANE_LIKE
  - UNKNOWN

allowed_weather:
  - CLEAR
  - CLOUDY
  - RAIN
  - RAIN_OR_WET_ROAD
  - SNOW
  - UNKNOWN

allowed_lighting:
  - DAY
  - TWILIGHT
  - NIGHT
  - BACKLIT
  - UNKNOWN

allowed_camera_views:
  - ELEVATED_OBLIQUE
  - OVERHEAD_TOP_DOWN
  - ROADSIDE_LEVEL
  - FRONT_DASHCAM
  - UNKNOWN

allowed_traffic_density:
  - LOW
  - MEDIUM
  - HIGH
  - UNKNOWN

traffic_density_rule:
  metric: "mean annotated vehicle boxes per image"
  LOW: "<= 4.0"
  MEDIUM: "> 4.0 and <= 10.0"
  HIGH: "> 10.0"
  note: "AAU uses 100 annotated RGB images per reviewed sequence; UA-DETRAC uses all annotated frames."

